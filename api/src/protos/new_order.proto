syntax = "proto3";

package order.v1;

import "google/protobuf/timestamp.proto";

message Order {
    int64 id = 1;
    optional int64 customer_id = 2;
    optional google.protobuf.Timestamp created_at = 3;
    repeated OrderItem items = 4;
}

message OrderItem {
    int64 order_id = 1;
    int64 product_id = 2;
    int32 quantity = 3;
}